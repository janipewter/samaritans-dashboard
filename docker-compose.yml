version: '2'
services:

  app:
    build: ./app
    networks:
      default:
        aliases:
          # Chromium rewrites a dotless hostname like 'app' to https://, so give the
          # container a name with a dot in it and it is left alone
          - app.local
    ports:
      - '80'
    restart: always

  browser:
    depends_on:
      - app
    environment:
      LAUNCH_URL: http://app.local/
      KIOSK: 1
      ENABLE_GPU: 0
    image: bh.cr/balenalabs/browser-aarch64
    ports:
      - '5011'
    privileged: true
    restart: always
