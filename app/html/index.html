<!DOCTYPE html>
<html>
    <head>
        <title>Samaritans Dashboard</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="css/uikit.min.css" />
        <link rel="stylesheet" href="css/fonts.css" />
        <script src="js/jquery-3.5.1.min.js"></script>
        <script src="js/moment.min.js"></script>
        <script src="js/uikit.min.js"></script>
        <script src="js/uikit-icons.min.js"></script>
        <script src="js/vue.global.prod.js"></script>
        <style>
            html { font-family: "Varah",Sans-serif; font-size: 16px }
            .uk-h1, .uk-h2, .uk-h3, .uk-h4, .uk-h5, .uk-h6, .uk-heading-2xlarge, .uk-heading-large, .uk-heading-medium, .uk-heading-small, .uk-heading-xlarge, h1, h2, h3, h4, h5, h6 { font-family: "Varah",Sans-serif }
            .connectors::before { border-radius: 0 3.5px 3.5px 0; width: 20px; height: 7px; top: 38px; left: 0 }
            .connectors::after { border-radius: 0 0 3.5px 3.5px; width: 7px; height: 20px; top: 0; left: 38px }
            .connectors::before, .connectors::after { content: ''; position: absolute; background: #f4f7f8 }
            .embed h1, .embed h2, .embed h3, .embed h4, .embed h5, .embed h6 { font-size: 1.5rem; line-height: 1.4 }
            .embed h1, .embed h2, .embed h3, .embed h4, .embed h5, .embed h6, .embed p { margin-top: 0 !important; margin-bottom: 0 !important }
            .embed img { display: none }
            nav .uk-h3 { font-size: 42px }

            .uk-breakpoint-2xl::before {
              content: '3800px';
            }
            :root {
              --uk-breakpoint-2xl: 3800px;
              --nav-height: 100px;
              --ticker-height: 70px;
            }
            /* no ticker page in the wiki - reclaim the space for the tiles */
            body.no-ticker { --ticker-height: 0px }

            .ticker {
              position: fixed; bottom: 0; left: 0; right: 0;
              height: var(--ticker-height);
              display: flex; align-items: center; overflow: hidden;
              background: #045; color: #fff;
            }
            .ticker__label {
              flex: none; align-self: stretch; display: flex; align-items: center;
              padding: 0 1.5rem; background: #009bc8;
              font-size: 1.5rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em;
            }
            /* clips the track, so items vanish behind the label rather than sliding over it */
            .ticker__viewport {
              flex: 1; align-self: stretch; position: relative; overflow: hidden;
            }
            /* the two copies are always equal width, so -50% lands exactly on the second one */
            .ticker__track {
              position: absolute; top: 0; left: 0; height: 100%;
              display: flex; align-items: center; width: max-content;
              animation: ticker-scroll 60s linear infinite;
              will-change: transform;
            }
            /* sized to its content, so the items loop as one continuous stream */
            .ticker__copy {
              flex: none; display: flex; align-items: center;
            }
            .ticker__item {
              flex: none; display: flex; align-items: center;
              padding-right: 4rem; font-size: 1.5rem; white-space: nowrap;
            }
            /* a flex child rather than inline text, so it centres on the text instead of the baseline */
            .ticker__item::before {
              content: ''; flex: none; width: 0.5rem; height: 0.5rem; margin-right: 4rem;
              border-radius: 50%; background: #009bc8;
            }
            @keyframes ticker-scroll {
              from { transform: translateX(0) }
              to { transform: translateX(-50%) }
            }
            @media (min-width: 3800px) {
              .uk-width-1-5\@2xl {
                width: 20%;
              }
              .uk-width-4-5\@2xl {
                width: 80%;
              }
              .uk-width-1-4\@2xl {
                width: 25%;
              }
              .uk-width-3-4\@2xl {
                width: 75%;
              }
              .uk-child-width-1-3\@2xl > * {
                width: calc(100% * 1 / 3.001);
              }
              html {
                font-size: 28px;
              }
              .embed img {
                display: unset;
              }
            }
            @media (max-width: 3799px) {
              .uk-visible\@2xl {
                display: none !important;
              }
            }
        </style>
    </head>
    <body class="no-ticker">
        <nav class="uk-navbar-container uk-navbar-transparent" style="height: var(--nav-height)" uk-navbar>
            <div class="uk-navbar-left">
                <img src="img/logo.png" class="uk-navbar-item uk-logo">
            </div>
            <div class="uk-navbar-right uk-navbar-item">
              <h1 class="uk-h3 uk-margin-remove-bottom" style="color: #045">Welcome to <span class="uk-text-bold"><!--#echo var="ENV_SITE_NAME" --></span></h1>
              <img src="img/arrows.png">
            </div>
        </nav>
        <div style="background: #f4f7f8" uk-grid>
            <div class="uk-width-5-6 uk-width-4-5@2xl" id="app" uk-grid>
                <div class="uk-width-2-3 uk-width-3-4@2xl" style="height: calc(100vh - var(--nav-height) - var(--ticker-height))">
                    <div v-if="eventsError || messagesError || shiftsError" class="uk-alert-danger" uk-alert>
                        <div v-if="eventsError" class="uk-grid-small" uk-grid>
                            <div><span uk-icon="icon: warning"></span></div>
                            <div><p>{{ eventsError }}</p></div>
                        </div>
                        <div v-if="messagesError" class="uk-grid-small" uk-grid>
                            <div><span uk-icon="icon: warning"></span></div>
                            <div><p>{{ messagesError }}</p></div>
                        </div>
                        <div v-if="shiftsError" class="uk-grid-small" uk-grid>
                            <div><span uk-icon="icon: warning"></span></div>
                            <div><p>{{ shiftsError }}</p></div>
                        </div>
                    </div>
                    <div class="uk-child-width-1-2 uk-child-width-1-3@2xl" style="padding-left: 15px; padding-top: 20px" uk-grid="masonry: true">
                        <template v-for="(event, index) in events" :key="event.id">
                            <div v-if="index < 12" class="uk-visible@2xl">
                                <div class="uk-card uk-card-body uk-light" style="background: #009bc8">
                                    <span class="connectors"></span>
                                    <p class="uk-text-meta uk-margin-remove">{{ formatDate(event.date) }}</p>
                                    <h1 class="uk-card-title uk-margin-remove-top">{{ event.name }}</h1>
                                </div>
                            </div>
                        </template>
                        <template v-for="message in messageTiles" :key="message.id">
                            <div>
                                <div class="uk-card uk-card-body uk-light" style="background: #045">
                                    <span class="connectors"></span>
                                    <div class="embed" v-html="message.contents"></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="uk-width-1-3 uk-width-1-4@2xl" style="height: calc(100vh - var(--nav-height) - var(--ticker-height))">
                    <div class="uk-child-width-1-1" style="padding-top: 20px" uk-grid="masonry: true">
                        <div v-if="!shiftsLoading">
                            <div class="uk-card uk-card-body uk-light" style="background: #72619f">
                                <span class="connectors"></span>
                                <p class="uk-text-meta uk-margin-remove">{{ formatDate() }}</p>
                                <h1 class="uk-card-title uk-margin-remove-top">Today's Shifts</h1>
                                <template v-for="(shift, index) in shifts" :key="shift.id">
                                    <h2 class="uk-h3 uk-margin-remove" v-if="index == 0 || shift.start_datetime != shifts[index -1].start_datetime || shift.duration != shifts[index -1].duration">
                                        {{ formatTime(shift.start_datetime) }} to {{ formatTime(endTime(shift.start_datetime, shift.duration)) }}
                                    </h2>
                                    <div>
                                        <em>({{ shift.rota }})</em>
                                        <template v-for="(volunteer, index) in shift.volunteers" :key="volunteer.id">
                                            <template v-if="index > 0">,</template>
                                            {{ volunteer.name }}
                                        </template>
                                    </div>
                                </template>
                                <p v-if="!shifts.length">There are no shifts scheduled for today.</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div v-if="tickerItems.length" class="ticker">
                    <div class="ticker__label">Latest News</div>
                    <div class="ticker__viewport">
                        <div class="ticker__track" :style="{ animationDuration: tickerDuration }">
                            <!-- the items are repeated so the track can loop seamlessly -->
                            <template v-for="copy in 2">
                                <span class="ticker__copy">
                                    <span v-for="(item, index) in tickerLoop" :key="copy + '-' + index" class="ticker__item">{{ item }}</span>
                                </span>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
            <div class="uk-width-1-6 uk-width-1-5@2xl" style="height: calc(100vh - var(--nav-height) - var(--ticker-height)); overflow: hidden">
                <iframe class="uk-width-1-1" id="status" scrolling="no" src="/embed/status/" style="height: calc(100vh - var(--nav-height) - var(--ticker-height))"></iframe>
            </div>
        </div>
        <script>
            $('#status').on("load", function() {
              $(this).contents().find( "body.embed" ).css( "border", "0" );
              $(this).contents().find( "body.embed" ).css( "padding", "0" );
              $(this).contents().find( "head" ).append('<style>body:before, body:after { width: 0 !important }</style>');
              $(this).contents().find( "main" ).css( "padding", "0" );

              $(this).contents().find( "span.waiting__label" ).html( "wait" );
              $(this).contents().find( "span.queue__label" ).html( "waiting" );
              $(this).contents().find( "p:not([id]) span.waiting__label" ).hide();
              $(this).contents().find( ".bubble__tag" ).hide();

              if (window.matchMedia("(min-width: 3800px)").matches) {
                $(this).contents().find( ".page-header__info" ).hide();
                $(this).contents().find( ".bubble-copy__item p" ).css( "font-size", "30px" );
                $(this).contents().find( "ul.status-bubbles" ).css( "margin-top", "70%" );
              } else {
                $(this).contents().find( ".page-header" ).hide();
                $(this).contents().find( "ul.status-bubbles" ).css( "margin-top", "24px" );
              }
            });

            // set via the REFRESH_INTERVAL_MINUTES environment variable, defaults to 15
            const refreshIntervalInMinutes = parseFloat('<!--#echo var="ENV_REFRESH_INTERVAL_MINUTES" -->') || 15;

            // the wiki page whose bullets feed the ticker, rather than appearing as a tile
            // set via the TICKER_PAGE_NAME environment variable, defaults to 'Ticker'
            const tickerPageName = ('<!--#echo var="ENV_TICKER_PAGE_NAME" -->'.trim() || 'Ticker').toLowerCase();

            const app = Vue.createApp({
              data() {
                return {
                  eventsError: null,
                  events: {},
                  messagesError: null,
                  messages: {},
                  shiftsLoading: true,
                  shiftsError: null,
                  shifts: {},
                  tickerRepeats: 1
                }
              },
              created() {
                this.fetchData();
                setInterval(this.fetchData, refreshIntervalInMinutes * 1000 * 60);
              },
              computed: {
                // the feed starts life as an empty object, so normalise before filtering
                messageList() {
                  return Array.isArray(this.messages) ? this.messages : Object.values(this.messages);
                },
                tickerPage() {
                  return this.messageList.find(message => this.isTickerPage(message));
                },
                messageTiles() {
                  return this.messageList.filter(message => !this.isTickerPage(message));
                },
                tickerItems() {
                  // no ticker page in the wiki - the ticker simply does not appear
                  if (!this.tickerPage)
                    return [];

                  const parsed = new DOMParser().parseFromString(this.tickerPage.contents || '', 'text/html');
                  const body = parsed.body;

                  // the page must be nothing but bullet lists - anything else and we cannot
                  // tell what belongs in the ticker, so show nothing rather than a half of it
                  const lists = Array.from(body.children).filter(child => {
                    return child.tagName === 'UL' || child.tagName === 'OL';
                  });
                  const strayText = Array.from(body.childNodes).some(node => {
                    return node.nodeType === Node.TEXT_NODE && node.textContent.trim().length;
                  });

                  if (!lists.length || lists.length !== body.children.length || strayText) {
                    console.warn(
                      'Ignoring the ' + this.tickerPage.name + ' wiki page: the ticker only ' +
                      'accepts a page containing nothing but bullet points.'
                    );
                    return [];
                  }

                  // one ticker item per bullet, nested bullets flattened in with the rest.
                  // the wiki editor leaves non-breaking spaces and line breaks in the
                  // markup, which render as odd gaps on a single scrolling line
                  const items = lists
                    .flatMap(list => Array.from(list.querySelectorAll('li')))
                    .map(item => item.textContent.replace(/\s+/g, ' ').trim())
                    .filter(item => item.length);

                  if (!items.length)
                    console.warn('The ' + this.tickerPage.name + ' wiki page has no bullet points to show.');

                  return items;
                },
                // a short list is repeated within each copy, so that one copy always more than
                // fills the bar and the items read as one continuous stream rather than a
                // short run followed by a gap. tickerRepeats is measured from the rendered
                // width once the items are on screen
                tickerLoop() {
                  return Array.from({ length: this.tickerRepeats }, () => this.tickerItems).flat();
                },
                tickerDuration() {
                  // keep the scroll speed constant regardless of how much text there is -
                  // seconds per character, so lower is faster
                  const characters = this.tickerLoop.join('').length;
                  return Math.max(20, characters * 0.2) + 's';
                }
              },
              watch: {
                tickerItems(items) {
                  document.body.classList.toggle('no-ticker', !items.length);
                  this.tickerRepeats = 1;
                  this.$nextTick(this.fitTicker);
                }
              },
              methods: {
                fetchData() {
                  this.fetchEvents();
                  this.fetchMessages();
                  this.fetchShifts();
                  document.getElementById('status').src = '/embed/status/';
                },
                async fetchEvents() {
                  try {
                    const response = await fetch('/events.json');
                    if (!response.ok)
                      throw new Error(response.statusText);
                    const json = await response.json();
                    // only show events in the next 7 days
                    // this.events = json['events']
                    this.events = json['events'].filter(event => moment(event.date).isBefore(moment().add(7, 'd')))
                    this.eventsError = null;
                  } catch (err) {
                    console.log(err);
                    this.eventsError = "Unable to access events data feed.";
                  }
                },
                async fetchMessages() {
                  try {
                    const response = await fetch('/wiki/branchcommsscreens/all_pages.json');
                    if (!response.ok)
                      throw new Error(response.statusText);
                    const json = await response.json();
                    this.messages = json
                    this.messagesError = null;
                  } catch (err) {
                    console.log(err);
                    this.messagesError = "Unable to access messages data feed.";
                  }
                },
                async fetchShifts() {
                  try {
                    const response = await fetch('/stats/export_rotas.json');
                    if (!response.ok)
                      throw new Error(response.statusText);
                    const json = await response.json();
                    this.shifts = json['shifts']
                    this.shiftsError = null;
                    this.shiftsLoading = false;
                  } catch (err) {
                    console.log(err);
                    this.shiftsError = "Unable to access shifts data feed.";
                  }
                },
                // repeat the list until one copy is wider than the bar, so there is never a
                // gap on screen between the end of the list and the start of the next pass
                fitTicker() {
                  const viewport = document.querySelector('.ticker__viewport');
                  const copy = document.querySelector('.ticker__copy');
                  if (!viewport || !copy || !copy.offsetWidth)
                    return;
                  if (copy.offsetWidth < viewport.offsetWidth && this.tickerRepeats < 20) {
                    this.tickerRepeats = this.tickerRepeats + 1;
                    this.$nextTick(this.fitTicker);
                  }
                },
                isTickerPage(message) {
                  const name = message.name || message.title || '';
                  return name.trim().toLowerCase() === tickerPageName;
                },
                formatDate(datetime = new Date()) {
                  return moment(datetime).format('dddd[, ]Do MMMM YYYY')
                },
                formatTime(datetime) {
                  return moment(datetime).utc().format('HH:mm')
                },
                endTime(start_datetime, duration) {
                  return moment(start_datetime).add(duration, 's')
                }
              }
            })

            app.mount('#app')
        </script>
    </body>
</html>
